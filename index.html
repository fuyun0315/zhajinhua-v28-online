<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>炸金花 V28 联网版</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>♠ 炸金花 V28</h1><div>多人互联网对战测试版 · 虚拟筹码</div></header><main>
<section id="entry" class="panel"><label>玩家昵称<input id="name" maxlength="12" value="玩家" placeholder="请输入昵称"></label><button id="create">创建房间</button><div class="join"><input id="roomInput" maxlength="6" inputmode="numeric" placeholder="输入6位房间号"><button id="join">加入房间</button></div><p>房主创建房间后，把6位房间号发给好友。每个房间最多6人。</p></section>
<section id="table" class="panel hidden"><div class="roomline">房间号 <b id="roomCode">------</b><button id="copy">复制房间号</button></div><div class="stats"><span>底池 <b id="pot">0</b></span><span>当前跟注 <b id="currentBet">0</b></span></div><div id="message" class="message">等待玩家加入……</div><h3>牌桌玩家</h3><div id="players" class="players"></div><h3>我的手牌</h3><div id="cards" class="cards"><span class="back">等待发牌</span></div><div id="actions" class="actions hidden"><button id="call">跟注</button><button id="raise">加注</button><button id="compare">比牌</button><button id="fold" class="danger">弃牌</button></div><div class="row"><button id="start">房主开始新一局</button><button id="leave" class="secondary">离开房间</button></div><p class="tip">测试版：虚拟筹码，无充值、提现或真钱功能。当前是第一版联网引擎，后续可继续把V28原版音效、托管、倒计时和牌桌动画迁移进来。</p></section><div id="toast"></div></main><script src="/socket.io/socket.io.js"></script><script src="/client.js"></script></body></html>
